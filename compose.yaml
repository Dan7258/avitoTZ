services:
  app:
    build: .
    container_name: avito-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - internal/config/.env
  db:
    image: postgres:latest
    container_name: avitoDB
    env_file:
      - internal/config/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata: